name: Release

# Push a tag `v<manifest version>` (for example v0.2.0-ea after bumping blender_manifest.toml to 0.2.0-ea).
# The tag must equal "v" + the manifest version, or the build job fails before building anything.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the GitHub Release
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: warp_sph_realtime-extension
          path: dist
      - name: Verify the downloaded package checksum
        working-directory: dist
        run: sha256sum --check SHA256SUMS.txt
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--generate-notes --verify-tag)
          # A hyphenated version (0.2.0-ea) is a pre-release.
          [[ "$GITHUB_REF_NAME" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/warp_sph_realtime-*.zip dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" "${flags[@]}"
