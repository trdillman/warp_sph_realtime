name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:  # also run by release.yml before anything is built

permissions:
  contents: read

jobs:
  check:
    # GitHub-hosted runners have no CUDA GPU: CUDA-only tests skip, CPU kernels and mocks still run.
    # Windows-only tests (long-path guard) run on windows-latest; the Blender 5.2 qualification tests
    # need WARPSPH_BLENDER_EXE and skip on both.
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"  # Blender 5.2 bundled Python
      - name: Install dev dependencies
        run: pip install numpy matplotlib "warp-lang==1.17.0" "fake-bpy-module==20251003" "pytest>=8" "ruff>=0.6" "pyright==1.1.408"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: pyright
      - name: Test
        run: pytest -rs
