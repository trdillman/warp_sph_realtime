# Development tooling only. The Blender extension itself is described by
# warp_sph_realtime/blender_manifest.toml and built with scripts/build_extension.py.

[dependency-groups]
dev = [
    "numpy",
    "warp-lang==1.17.0",
    "fake-bpy-module==20251003",  # bpy/gpu type stubs for pyright
    "pytest>=8",
    "ruff>=0.6",
    "pyright==1.1.408",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"

[tool.ruff]
target-version = "py313"  # Blender 5.2 bundles Python 3.13
line-length = 120
extend-exclude = [".codex", "research_notes"]  # research probes kept verbatim as evidence

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP", "I"]
# UP018: Warp kernels need float(0.0)/int(0) to declare a dynamic (mutable) variable; a bare literal is a
# constant and fails kernel codegen ("Error mutating a constant ... inside a dynamic loop").
ignore = ["UP018"]

[tool.ruff.lint.per-file-ignores]
# Blender stubs must be installed in sys.modules before the package is imported.
"tests/test_blender_mock.py" = ["E402"]
# Compact one-line GL fakes/probe steps kept verbatim from the verified SSFR repair.
"tests/runtime_ssfr_*.py" = ["E701", "E702"]
"tests/test_ssfr_gl_contract.py" = ["E701", "E702"]

[tool.pyright]
include = ["warp_sph_realtime", "tests", "scripts"]
# Live-Blender GPU probe scripts (run via `blender --python`), not headless test modules.
exclude = ["**/__pycache__", "tests/run_ssfr_gui.py", "tests/runtime_ssfr_*.py"]
extraPaths = ["."]
pythonVersion = "3.13"
# Suppressions below are false positives from third-party stubs, not project bugs
# (unsuppressed baseline: 460 errors, all in these rules):
#   Warp kernel DSL (wp.array[float], wp.tid(), vector math)
reportArgumentType = "none"
reportIndexIssue = "none"
reportOperatorIssue = "none"
reportCallIssue = "none"
#   ctypes GL entry points are None until _GLInterop.ensure_initialized()
reportOptionalCall = "none"
reportOptionalMemberAccess = "none"
#   bpy: runtime Scene properties, module stubs, annotation-style props, {'FINISHED'} returns
reportAttributeAccessIssue = "none"
reportAssignmentType = "none"
reportInvalidTypeForm = "none"
reportIncompatibleMethodOverride = "none"
